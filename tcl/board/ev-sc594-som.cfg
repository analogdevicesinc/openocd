set CHIPNAME adspsc594

set ENABLE_SPI_FLASH 1

source [find target/adspsc59x.cfg]
source [find board/adspsc5xx_ezbrd.tcl]

# Allocate space for flash algorithm
$_TARGETNAME configure -work-area-phys 0x20040000 -work-area-virt 0x20040000 -work-area-size 0x80000

if { $ENABLE_SPI_FLASH == 1 } {
    # Find and set up algorithm parameters
	source [find board/flash_algorithms/issi25lp512m.cfg]
	set SPI_FLASH_ALGO_FILENAME 59x_issi_spi.inc
	set SPI_FLASH_PARAMETER_FILENAME 59x_issi_spi_params.inc
	set_algo_paths $SPI_FLASH_ALGO_FILENAME $SPI_FLASH_PARAMETER_FILENAME

	flash bank $_CHIPNAME.spi adspsc59x $_FLASH_BASE $_FLASH_SIZE 0 0 $_TARGETNAME $_FLASH_SECTOR_SIZE $ALGO_PATH $PARAMETER_PATH
}

proc adspsc59x_board_init {} {
   adspsc59x_init_ddr3  0

   set canfd0_base 0x31046000
   set canfd1_base 0x31047000

   # Initialize CANFD
   canfd_config $canfd0_base
   canfd_config $canfd1_base
}