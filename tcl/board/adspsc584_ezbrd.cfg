set CHIPNAME adspsc584

set ENABLE_SPI_FLASH 1

source [find target/adspsc58x.cfg]
source [find board/adspsc5xx_ezbrd.tcl]

# Allocate space for flash algorithm
$_TARGETNAME configure -work-area-phys 0x20088000 -work-area-virt 0x20088000 -work-area-size 0x40000

if { $ENABLE_SPI_FLASH == 1 } {
    # Find and set up algorithm parameters
	source [find board/flash_algorithms/w25q128fv.cfg]
	set SPI_FLASH_ALGO_FILENAME 58x_w25q128fv_spi.inc
	set SPI_FLASH_PARAMETER_FILENAME 58x_w25q128fv_spi_params.inc
	set_algo_paths $SPI_FLASH_ALGO_FILENAME $SPI_FLASH_PARAMETER_FILENAME

	flash bank $_CHIPNAME.spi adspsc5xx_a5 $_FLASH_BASE $_FLASH_SIZE 0 0 $_TARGETNAME $_FLASH_SECTOR_SIZE $ALGO_PATH $PARAMETER_PATH
}

proc adspsc58x_board_init {} {
   adspsc5xx_init_ddr2
}
