set XTENSA_DAP enable

# Set flash parameters for IS25LP512M chip
#set _FLASH_BASE 0x60000000
set _FLASH_BASE 0x0

# Create Xtensa target first
source [find target/adsp2183x.cfg]

# Find and set up SPI flash algorithm parameters
source [find board/algorithms/ISSI25LP512M.cfg]

# Find and set up xSPI hyperFlash algorithm parameters
source [find board/algorithms/S26KL512S.cfg]

# Allocate space for flash algorithm
$_TARGETNAME_SFX configure -work-area-phys 0x20000000 -work-area-size 0x80000

# Flash size is automatically probed
#flash bank $_CHIPNAME.flash adsp2183x $_FLASH_BASE 0 0 0 $_TARGETNAME_SFX $CFG_ADDRESS $BUF_ADDRESS $ENTRY_ADDRESS $ALGO_PATH

# Flash size is automatically probed
flash bank $_CHIPNAME.hyperflash adsp2183x_hyperflash $_FLASH_BASE 0 0 0 $_TARGETNAME_SFX $HYPERFLASH_CFG_ADDRESS $HYPERFLASH_BUF_ADDRESS $HYPERFLASH_ENTRY_ADDRESS $HYPERFLASH_ALGO_PATH

# define our board level memory here

# we use ranges because multiple flash device types can span
# the flash memory region from 0x60000000 - 0x80000000
# xSPI (Use ro for HyperFlash™, rw for HyperRAM™)

$_TARGETNAME_SFX xtensa xtmem	spi_range1			0x60000000	0x04000000	ro
# qSPI
$_TARGETNAME_SFX xtensa xtmem	spi_range2			0x70000000	0x04000000	ro

$_TARGETNAME_SFX xtensa xtmem	sram				0x80000000	0x20000000  rw

# only allow memory access based on our xtmem memory map
$_TARGETNAME_SFX xtensa set_permissive off