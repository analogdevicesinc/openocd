# Set flash parameters
set _OTP_BASE 0x24000000
set _OTP_SIZE 0x490
set _OTP_SECTOR_SIZE 0x490

proc set_algo_paths { inc_file param_file } {
	global OTP_ALGO_PATH OTP_PARAMETER_PATH

	source [find board/flash_algorithms/algoFileFinder.cfg]

	# Find and set the OTP_ALGO_PATH
	set OTP_ALGO_PATH [findAndSetFile $scriptDirectory $inc_file]
	if { [string length $OTP_ALGO_PATH] <= 0} {
		set OTP_ALGO_PATH $inc_file
		echo "Could not find $inc_file in [file dirname [info script]]"
	}

	# Find and set OTP_PARAMETER_PATH
	set OTP_PARAMETER_PATH [findAndSetFile $scriptDirectory $param_file]
	if { [string length $OTP_PARAMETER_PATH] <= 0} {
		set OTP_PARAMETER_PATH $param_file
		echo "Could not find $param_file in [file dirname [info script]]"
	}
}