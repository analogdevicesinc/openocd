set ALGO_FILENAME 2183x_flash.inc
set PARAMETER_FILENAME 2183x_flash_params.inc

# Define a procedure to find and set the file path
proc findAndSetFile {directory pattern} {
    set files [glob -nocomplain -directory $directory $pattern]

    if {[llength $files] > 0} {
        return [lindex $files 0]
    } else {
        return ""
    }
}

# Get the directory of the current script
set scriptDirectory [file dirname [info script]]

# Find and set the ALGO_PATH
set ALGO_PATH [findAndSetFile $scriptDirectory $ALGO_FILENAME]
if { [string length $ALGO_PATH] <= 0} {
	set ALGO_PATH $ALGO_FILENAME
	echo "Could not find $ALGO_FILENAME in [file dirname [info script]]"
}

set PARAMETER_PATH [findAndSetFile $scriptDirectory $PARAMETER_FILENAME]
if { [string length $PARAMETER_PATH] <= 0} {
	set PARAMETER_PATH $PARAMETER_FILENAME
	echo "Could not find $PARAMETER_FILENAME in [file dirname [info script]]"
}