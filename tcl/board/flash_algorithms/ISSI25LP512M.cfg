set ALGO_FILENAME 2183x_flash.inc
set CFG_ADDRESS 0x20028000
set BUF_ADDRESS 0x20028020
set ENTRY_ADDRESS 0x200200f0

proc findAndSetFile {directory pattern} {
	set ::ALGO_PATH [lindex [glob -nocomplain -directory $directory $pattern] 0]
}

findAndSetFile [file dirname [info script]] $ALGO_FILENAME
if { [string length $ALGO_PATH] > 0} {
	echo "$::ALGO_PATH"
} else {
	set ALGO_PATH $ALGO_FILENAME
	echo "Could not find $ALGO_FILENAME in [file dirname [info script]]"
}