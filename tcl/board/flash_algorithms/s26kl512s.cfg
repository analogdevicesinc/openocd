# Set flash parameters
set _HYPERFLASH_BASE 0x60000000
set _HYPERFLASH_SIZE 0x10000000
set _HYPERFLASH_SECTOR_SIZE 0x40000

proc set_algo_paths { inc_file param_file } {
	global HYPERFLASH_ALGO_PATH HYPERFLASH_PARAMETER_PATH

	source [find board/flash_algorithms/algoFileFinder.cfg]

	# Find and set the HYPERFLASH_ALGO_PATH
	set HYPERFLASH_ALGO_PATH [findAndSetFile $scriptDirectory $inc_file]
	if { [string length $HYPERFLASH_ALGO_PATH] <= 0} {
		set ALGO_PATH $inc_file
		echo "Could not find $inc_file in [file dirname [info script]]"
	}

	set HYPERFLASH_PARAMETER_PATH [findAndSetFile $scriptDirectory $param_file]
	if { [string length $HYPERFLASH_PARAMETER_PATH] <= 0} {
		set HYPERFLASH_PARAMETER_PATH $param_file
		echo "Could not find $param_file in [file dirname [info script]]"
	}
}