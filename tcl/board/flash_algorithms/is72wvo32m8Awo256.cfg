proc set_algo_paths { inc_file param_file} {
	global XSPI_ALGO_PATH XSPI_PARAMETER_PATH _XSPI_BASE _XSPI_SIZE _XSPI_SECTOR_SIZE
	
	# Set flash parameters
	set _XSPI_BASE 0x60000000
	set _XSPI_SIZE 0x2000000
	set _XSPI_SECTOR_SIZE 0x10000

	source [find board/flash_algorithms/algoFileFinder.cfg]

	# Find and set the XSPI_ALGO_PATH
	set XSPI_ALGO_PATH [findAndSetFile $scriptDirectory $inc_file]
	if { [string length $XSPI_ALGO_PATH] <= 0} {
		echo "Could not find $inc_file in [file dirname [info script]]"
	}

	# Find and set XSPI_PARAMETER_PATH
	set XSPI_PARAMETER_PATH [findAndSetFile $scriptDirectory $param_file]
	if { [string length $XSPI_PARAMETER_PATH] <= 0} {
		echo "Could not find $param_file in [file dirname [info script]]"
	}
}