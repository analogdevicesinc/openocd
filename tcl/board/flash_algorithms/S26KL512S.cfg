set HYPERFLASH_ALGO_FILENAME xSPI_HyperFshAcc_21835.inc
set HYPERFLASH_PARAMETER_FILENAME xSPI_HyperFshAcc_21835_params.inc

# Define a procedure to find and set the file path
proc findAndSetFile {directory pattern} {
    set files [glob -nocomplain -directory $directory $pattern]

    if {[llength $files] > 0} {
        return [lindex $files 0]
    } else {
        return ""
    }
}

# Get the directory of the current script
set scriptDirectory [file dirname [info script]]

# Find and set the ALGO_PATH
set HYPERFLASH_ALGO_PATH [findAndSetFile $scriptDirectory $HYPERFLASH_ALGO_FILENAME]
if { [string length $HYPERFLASH_ALGO_PATH] <= 0} {
	set ALGO_PATH $HYPERFLASH_ALGO_FILENAME
	echo "Could not find $HYPERFLASH_ALGO_FILENAME in [file dirname [info script]]"
}

set HYPERFLASH_PARAMETER_PATH [findAndSetFile $scriptDirectory $HYPERFLASH_PARAMETER_FILENAME]
if { [string length $HYPERFLASH_PARAMETER_PATH] <= 0} {
	set HYPERFLASH_PARAMETER_PATH $HYPERFLASH_PARAMETER_FILENAME
	echo "Could not find $HYPERFLASH_PARAMETER_FILENAME in [file dirname [info script]]"
}