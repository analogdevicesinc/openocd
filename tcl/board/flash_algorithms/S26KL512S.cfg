set HYPERFLASH_ALGO_FILENAME xSPI_HyperFshAcc_21835_Core1.inc
set HYPERFLASH_CFG_ADDRESS 0x200107a0
set HYPERFLASH_BUF_ADDRESS 0x200107c0
set HYPERFLASH_ENTRY_ADDRESS 0x200000f0

proc findAndSetFile {directory pattern} {
	set ::HYPERFLASH_ALGO_PATH [lindex [glob -nocomplain -directory $directory $pattern] 0]
}

findAndSetFile [file dirname [info script]] $HYPERFLASH_ALGO_FILENAME
if { [string length $HYPERFLASH_ALGO_PATH] > 0} {
	echo "$::HYPERFLASH_ALGO_PATH"
} else {
	set HYPERFLASH_ALGO_PATH $HYPERFLASH_ALGO_FILENAME
	echo "Could not find $HYPERFLASH_ALGO_FILENAME in [file dirname [info script]]"
}