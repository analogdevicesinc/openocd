set XTENSA_DAP enable

set CHIPNAME adsp2184x

set ENABLE_SPI_FLASH 1
set ENABLE_EMMC 1
set ENABLE_XSPI 1

# Create Xtensa target first
source [find target/adsp2184x.cfg]

# Allocate space for flash algorithm
$_TARGETNAME_SFX configure -work-area-phys 0x20500000 -work-area-size 0x100000

if { $ENABLE_SPI_FLASH == 1 } {
	# Find and set up SPI flash algorithm parameters
	source [find board/flash_algorithms/is25wp02gg.cfg]
	set SPI_FLASH_ALGO_FILENAME IS25WP02GG_dpia_SC846_Core1.inc
	set SPI_FLASH_PARAMETER_FILENAME IS25WP02GG_dpia_SC846_Core1_params.inc
	set_algo_paths $SPI_FLASH_ALGO_FILENAME $SPI_FLASH_PARAMETER_FILENAME

	flash bank $_CHIPNAME.spi adsp2184x $_FLASH_BASE $_FLASH_SIZE 0 0 $_TARGETNAME_SFX $_FLASH_SECTOR_SIZE $ALGO_PATH $PARAMETER_PATH
}

if { $ENABLE_XSPI == 1 } {
	# Find and set up SPI flash algorithm parameters
	source [find board/flash_algorithms/is72wvo32m8Awo256.cfg]
	set XSPI_FLASH_ALGO_FILENAME 2184x_xSPI_NORFlash.inc
	set XSPI_FLASH_PARAMETER_FILENAME 2184x_xSPI_NORFlash_params.inc
	set_algo_paths $XSPI_FLASH_ALGO_FILENAME $XSPI_FLASH_PARAMETER_FILENAME

	flash bank $_CHIPNAME.xspi adsp2184x $_XSPI_BASE $_XSPI_SIZE 0 0 $_TARGETNAME_SFX $_XSPI_SECTOR_SIZE $XSPI_ALGO_PATH $XSPI_PARAMETER_PATH
}

if { $ENABLE_EMMC == 1 } {
	# Find and set up emmc algorithm parameters
	source [find board/flash_algorithms/issi22tf16g.cfg]
	set EMMC_ALGO_FILENAME IS22TF16G_dpia_SC846_Core1.inc
	set EMMC_PARAMETER_FILENAME IS22TF16G_dpia_SC846_Core1_params.inc
	set_algo_paths $EMMC_ALGO_FILENAME $EMMC_PARAMETER_FILENAME

	flash bank $_CHIPNAME.emmc adsp2184x $_FLASH_BASE $_FLASH_SIZE 0 0 $_TARGETNAME_SFX $_FLASH_SECTOR_SIZE $ALGO_PATH $PARAMETER_PATH
}

$_TARGETNAME_SFX configure -event reset-init {
	global _TARGETNAME_SFX
	# switch current target to SHARC-FX to allow SPI flash to be programmed
	targets $_TARGETNAME_SFX
}

# define our board level memory here

# we use ranges because multiple flash device types can span
# the flash memory region from 0x60000000 - 0x80000000
# xSPI (Use ro for HyperFlash™, rw for HyperRAM™)

$_TARGETNAME_SFX xtensa xtmem	spi_range1			0x60000000	0x04000000	ro
# qSPI
$_TARGETNAME_SFX xtensa xtmem	spi_range2			0x70000000	0x04000000	ro

$_TARGETNAME_SFX xtensa xtmem	sram				0x80000000	0x20000000  rw

# only allow memory access based on our xtmem memory map
$_TARGETNAME_SFX xtensa set_permissive off
