# Maxim Integrated MAX32657 OpenOCD target configuration file
# www.maximintegrated.com

# Additional command line options:
#    1. -c "set RESET_ON_CONNECT 1" -> toggle srst on connect 
#       (has to be 1st command on the command line)

# Set the reset pin configuration
reset_config srst_only
adapter srst delay 2
adapter srst pulse_width 2

# Set flash parameters
set FLASH_BASE 0x01000000
set FLASH_BASE_SECURE 0x11000000
set FLASH_SIZE 0x100000
set FLC_BASE 0x50029000
set FLASH_SECTOR 0x2000
set FLASH_CLK 100
set FLASH_OPTIONS 0x01

# Use Serial Wire Debug
transport select swd

# RESET_ON_CONNECT can be used when the processor is in deep sleep mode
# Typically it is best to have a small pause in the application before
# entering deep sleep so that the debugger can gain control before
# reset is de-asserted in examine-end
if { [info exists RESET_ON_CONNECT] } {
   set _RESET_ON_CONNECT $RESET_ON_CONNECT
} else {
   set _RESET_ON_CONNECT 0
}

# override the original reset_config
if { $_RESET_ON_CONNECT != 0 } {
   echo "reset on initial connection"
   reset_config srst_only srst_nogate connect_assert_srst 
}

source [find target/max32xxx_common.cfg]

# allow access to secure flash addresses
flash bank $_CHIPNAME.flash_secure max32xxx $FLASH_BASE_SECURE $_FLASH_SIZE 0 0 $_CHIPNAME.cpu \
$_FLC_BASE $_FLASH_SECTOR $_FLASH_CLK $_FLASH_OPTIONS

$_CHIPNAME.cpu configure -event reset-deassert-post {
   global ALLOW_LOW_PWR_DBG
   
   echo "reset-deassert-post"
   
   if { $ALLOW_LOW_PWR_DBG == 1 } {
      enable_debug
   } else {
      halt
   }
   
}

# called before target examine
$_CHIPNAME.cpu configure -event examine-start {
   global _RESET_ON_CONNECT

   if { $_RESET_ON_CONNECT != 0 } {
      echo "de-assert reset"
      adapter deassert srst
   }
}

# first thing called once target examined flag is set
$_CHIPNAME.cpu configure -event examine-first {
   global ALLOW_LOW_PWR_DBG
   global _RESET_ON_CONNECT

   # halt as quickly as possible after srst is de-asserted
   if { $_RESET_ON_CONNECT != 0 } {
      echo "halt after srst de-asserted"
      poll
      halt
      # clear flag because we have already connected
      set _RESET_ON_CONNECT 0
   }
   
   if { $ALLOW_LOW_PWR_DBG == 1 } {
      enable_debug
   }
}
