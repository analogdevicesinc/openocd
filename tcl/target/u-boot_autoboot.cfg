proc _autoboot {} {
    global _TARGETNAME

    if {![file exists "[pwd]/u-boot-spl"]} {
        echo "ERROR: u-boot-spl not found"
        shutdown
    }
    if {![file exists "[pwd]/u-boot"]} {
        echo "ERROR: u-boot not found"
        shutdown
    }

    halt

    echo "Loading Secondary Program Loader..."
    set spl_info [load_image "[pwd]/u-boot-spl"]
    regexp {address ([0-9A-Fa-fx]+)} $spl_info -> spl_entry
    echo "SPL load address: $spl_entry"
    resume $spl_entry

    sleep 2000
    halt

    echo "Loading U-Boot..."
    set uboot_info [load_image "[pwd]/u-boot"]
    regexp {address ([0-9A-Fa-fx]+)} $uboot_info -> uboot_entry
    echo "U-Boot load address: $uboot_entry"
    resume $uboot_entry

    echo "Boot sequence complete."
}

$_TARGETNAME configure -event reset-init {
    after 150 { _autoboot }
}

init
reset init
